<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 160">
  <!-- pwaOS horizontal lockup: mark + wordmark (transparent bg) -->
  <defs>
    <linearGradient id="pfill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4de0ef"/>
      <stop offset="1" stop-color="#19a8c2"/>
    </linearGradient>
  </defs>

  <!-- mark, tight tile variant -->
  <g>

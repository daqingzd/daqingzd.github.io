<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- pwaOS app icon — the "p" window (full detail, large sizes) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151a26"/>
      <stop offset="1" stop-color="#0b0d12"/>
    </linearGradient>
    <linearGradient id="pfill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4de0ef"/>
      <stop offset="1" stop-color="#19a8c2"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.65">
      <stop offset="0" stop-color="#4de0ef" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#4de0ef" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="tile">
      <rect x="16" y="16" width="480" height="480" rx="108"/>
    </clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <rect x="16" y="16" width="480" height="480" fill="url(#bg)"/>
    <!-- glow behind the mark -->
    <circle cx="252" cy="230" r="200" fill="url(#glow)"/>
  </g>

  <!-- the p: ONE unified path, concentric arcs (uniform 50px bowl ring),
       optically centered (glyph nudged up; bowl mass compensates the descender) -->
  <path fill="url(#pfill)" fill-rule="evenodd"
        d="M 145 82
           H 271
           A 106 106 0 0 1 271 294
           H 185
           V 392
           A 18 18 0 0 1 167 410
           H 145
           A 18 18 0 0 1 127 392
           V 100
           A 18 18 0 0 1 145 82
           Z
           M 185 132
           H 271
           A 56 56 0 0 1 271 244
           H 185
           Z"/>

  <!-- browser window centered in the counter (bbox center 256,188) -->
  <g>
    <rect x="223" y="162" width="66" height="52" rx="8" fill="#131722" stroke="#2a3547" stroke-width="2"/>
    <path d="M 223 170 a 8 8 0 0 1 8 -8 h 50 a 8 8 0 0 1 8 8 v 6 h -66 Z" fill="#f5c542"/>
    <circle cx="233" cy="169" r="3" fill="#e0564b"/>
    <circle cx="243" cy="169" r="3" fill="#58c98b"/>
    <rect x="229" y="186" width="24" height="5" rx="2.5" fill="#4de0ef"/>
    <rect x="229" y="196" width="40" height="5" rx="2.5" fill="#3a4152"/>
    <rect x="229" y="206" width="32" height="5" rx="2.5" fill="#3a4152"/>
  </g>
</svg>
